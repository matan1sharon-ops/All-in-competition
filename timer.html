<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ALL IN — End Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --surface2: #1c1c1c;
        --border: #2a2a2a;
        --text: #f0f0f0;
        --muted: #888;
        --accent: #ffd700;
        --green: #2e7d32;
        --yellow: #f9a825;
        --red: #c62828;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Barlow', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* ── DISPLAY ── */
      #display {
        height: 100%;
        display: flex;
        flex-direction: column;
        transition: background 0.2s;
      }
      #display.c-red {
        background: var(--red);
      }
      #display.c-green {
        background: var(--green);
      }
      #display.c-yellow {
        background: var(--yellow);
        color: #000;
      }
      #display.c-idle {
        background: var(--surface);
      }
      .d-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2vh 3vw;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 5vh;
        letter-spacing: 2px;
      }
      .d-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #d-time {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: min(45vh, 38vw);
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #d-phase {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 7vh;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      #d-group {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 14vh;
        letter-spacing: 6px;
      }
      .d-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5vh 3vw;
        font-size: 2.2vh;
        opacity: 0.8;
      }
      .d-bottom button {
        background: rgba(0, 0, 0, 0.35);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 8px 14px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 2.2vh;
        cursor: pointer;
      }
      /* ── FINALS: ALTERNATING DISPLAY ── */
      #alt {
        height: 100%;
        display: none;
        flex-direction: column;
        background: var(--surface);
      }
      #alt.c-red {
        background: var(--red);
      }
      .a-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5vh 3vw;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 4.5vh;
        letter-spacing: 2px;
      }
      .a-sides {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1vw;
        padding: 0 1vw;
      }
      .a-side {
        border-radius: 2vh;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 2vh 1vw;
        transition: background 0.2s;
        overflow: hidden;
      }
      .a-side.c-green {
        background: var(--green);
      }
      .a-side.c-yellow {
        background: var(--yellow);
        color: #000;
      }
      .a-side.c-red {
        background: rgba(0, 0, 0, 0.35);
      }
      .a-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 8vh;
        line-height: 1.05;
        text-align: center;
        text-transform: uppercase;
      }
      .a-clock {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: min(30vh, 20vw);
        line-height: 1;
        font-variant-numeric: tabular-nums;
        height: min(32vh, 22vw);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .a-clock.wait {
        font-size: 9vh;
        opacity: 0.45;
        letter-spacing: 4px;
      }
      .a-pts {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 11vh;
        line-height: 1;
        color: var(--accent);
        text-align: center;
      }
      .a-side.c-yellow .a-pts {
        color: #000;
      }
      .a-pts small {
        display: block;
        font-size: 2.4vh;
        letter-spacing: 2px;
        opacity: 0.8;
        text-align: center;
      }
      .a-arrows {
        display: flex;
        gap: 1vw;
        align-items: center;
        min-height: 8vh;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
      }
      .a-arrows span {
        min-width: 7vh;
        padding: 0.6vh 1vh;
        border-radius: 1vh;
        background: rgba(255, 255, 255, 0.15);
        text-align: center;
        font-size: 5.5vh;
      }
      .a-arrows span {
        height: 8vh;
        line-height: 6.8vh;
      }
      .a-arrows b {
        min-width: 10vh;
        height: 8vh;
        line-height: 6.8vh;
        padding: 0.6vh 1vh;
        margin-left: 1vw;
        border-radius: 1vh;
        border: 2px solid var(--accent);
        text-align: center;
        font-size: 5.5vh;
      }
      .a-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.2vh 3vw;
        font-size: 2.4vh;
      }
      .a-bottom button {
        background: rgba(0, 0, 0, 0.35);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 8px 14px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 2.2vh;
        cursor: pointer;
      }
      .cbtn.on {
        background: var(--green);
        border-color: var(--green);
      }
      /* ── CONTROLLER ── */
      #control {
        display: none;
        max-width: 560px;
        margin: 0 auto;
        padding: 14px;
      }
      body.embed #control {
        max-width: none;
        padding: 0;
      }
      .c-status {
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        margin-bottom: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
      }
      .c-status.c-red {
        background: var(--red);
      }
      .c-status.c-green {
        background: var(--green);
      }
      .c-status.c-yellow {
        background: var(--yellow);
        color: #000;
      }
      #c-time {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 72px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #c-info {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 1px;
      }
      .c-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .c-grid.four {
        grid-template-columns: 1fr 1fr 1fr 1fr;
      }
      .c-grid.three {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .cbtn {
        border: none;
        border-radius: 10px;
        padding: 16px 8px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 900;
        font-size: 20px;
        letter-spacing: 1px;
        cursor: pointer;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .cbtn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .cbtn:active {
        transform: scale(0.97);
      }
      .cbtn.big {
        grid-column: span 2;
        font-size: 26px;
        padding: 22px 8px;
        background: var(--accent);
        color: #000;
        border: none;
      }
      .cbtn.stop {
        grid-column: span 2;
        background: var(--red);
        border: none;
      }
      .cbtn.small {
        font-size: 15px;
        padding: 12px 6px;
      }
      .c-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .c-row input {
        width: 80px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        text-align: center;
      }
      .c-label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin: 12px 0 6px;
      }
      #msg {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="msg"></div>

    <div id="display" class="c-idle" style="display: none">
      <div class="d-top">
        <span id="d-comp"></span>
        <span id="d-end"></span>
      </div>
      <div class="d-main">
        <div id="d-group"></div>
        <div id="d-time">--</div>
        <div id="d-phase"></div>
      </div>
      <div class="d-bottom">
        <span id="d-next"></span>
        <span>
          <button id="btn-sound" onclick="toggleSound()">🔇 SOUND OFF</button>
          <button onclick="goFullscreen()">⛶ FULL SCREEN</button>
        </span>
      </div>
    </div>

    <div id="alt">
      <div class="a-top">
        <span id="a-label"></span>
        <span id="a-end"></span>
      </div>
      <div class="a-sides">
        <div class="a-side" id="a-L">
          <div class="a-name"></div>
          <div class="a-clock"></div>
          <div class="a-pts"></div>
          <div class="a-arrows"></div>
        </div>
        <div class="a-side" id="a-R">
          <div class="a-name"></div>
          <div class="a-clock"></div>
          <div class="a-pts"></div>
          <div class="a-arrows"></div>
        </div>
      </div>
      <div class="a-bottom">
        <span id="a-note"></span>
        <span>
          <button id="btn-sound-a" onclick="toggleSound()">🔇 SOUND OFF</button>
          <button onclick="goFullscreen()">⛶ FULL SCREEN</button>
        </span>
      </div>
    </div>

    <div id="control">
      <div class="c-status" id="c-status">
        <div id="c-info">—</div>
        <div id="c-time">--</div>
        <div id="c-sub" style="font-size: 13px; opacity: 0.8"></div>
      </div>
      <div class="c-grid" id="starter-row" style="display: none">
        <button class="cbtn small" id="btn-start-L" onclick="setStarter('L')"></button>
        <button class="cbtn small" id="btn-start-R" onclick="setStarter('R')"></button>
      </div>
      <div class="c-grid">
        <button class="cbtn big" id="btn-main" onclick="mainAction()">START</button>
        <button class="cbtn" id="btn-pause" onclick="pauseResume()">⏸ PAUSE</button>
        <button class="cbtn" onclick="restartEnd()">↺ RESTART END</button>
      </div>
      <div class="c-label" id="adj-label">Change time (pause first)</div>
      <div class="c-grid four" id="adj-btns">
        <button class="cbtn" onclick="adjust(-5)">−5 s</button>
        <button class="cbtn" onclick="adjust(-1)">−1 s</button>
        <button class="cbtn" onclick="adjust(1)">+1 s</button>
        <button class="cbtn" onclick="adjust(5)">+5 s</button>
      </div>
      <div class="c-grid">
        <button class="cbtn stop" onclick="emergency()">⛔ EMERGENCY STOP</button>
      </div>
      <div class="c-label">Jump to end</div>
      <div class="c-row">
        <select id="jump-end" class="cbtn small" style="flex: 1"></select>
        <button class="cbtn small" onclick="jumpEnd()">GO</button>
      </div>
      <div class="c-label">Manual beeps</div>
      <div class="c-grid three">
        <button class="cbtn small" onclick="manualBeep(1)">1 BEEP</button>
        <button class="cbtn small" onclick="manualBeep(2)">2 BEEPS</button>
        <button class="cbtn small" onclick="manualBeep(3)">3 BEEPS</button>
      </div>
      <div class="c-row" style="margin-top: 12px">
        <button class="cbtn small" id="btn-sound-c" onclick="toggleSound()" style="flex: 1">
          🔇 SOUND OFF ON THIS DEVICE
        </button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        onSnapshot,
        serverTimestamp,
      } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
      const liveConfig = {
        apiKey: 'AIzaSyBVDdelVGWJOgQZwN_Um6rppelcNYVN2To',
        authDomain: 'all-in-competition.firebaseapp.com',
        projectId: 'all-in-competition',
        storageBucket: 'all-in-competition.firebasestorage.app',
        messagingSenderId: '620146958631',
        appId: '1:620146958631:web:1e88019d1436372689c902',
      };
      const devConfig = {
        apiKey: 'AIzaSyDjmlQJbyRUXXFRlEfVMil0M_DFFUP5Fcc',
        authDomain: 'all-in-dev-f2807.firebaseapp.com',
        projectId: 'all-in-dev-f2807',
        storageBucket: 'all-in-dev-f2807.firebasestorage.app',
        messagingSenderId: '358306227588',
        appId: '1:358306227588:web:4e3ad05ffc3812415d69d1',
      };
      // Live data only on GitHub Pages; anywhere else (your computer) uses all-in-dev
      const firebaseConfig = location.hostname.endsWith('github.io') ? liveConfig : devConfig;
      const app = initializeApp(firebaseConfig);
      /* ── SAFE TEXT ──
         Everything read from Firebase goes through cleanData(): characters that could break the page
         or run code (< > " ' & ` \\) are swapped for look-alikes, e.g. O'Brien → O’Brien. */
      const UNSAFE = { '<': '‹', '>': '›', '"': '”', "'": '’', '&': '＆', '`': 'ʹ', '\\': '∖' };
      const cleanText = (s) => String(s).replace(/[<>"'&`\\]/g, (ch) => UNSAFE[ch]);
      function cleanData(v) {
        if (typeof v === 'string') return cleanText(v);
        if (Array.isArray(v)) return v.map(cleanData);
        if (v && typeof v === 'object') {
          if (typeof v.toMillis === 'function') return v; // Firestore timestamp
          const o = {};
          Object.keys(v).forEach((k) => (o[k] = cleanData(v[k])));
          return o;
        }
        return v;
      }
      const db = getFirestore(app);

      /* ── END TIMER ──
         competitions/{id}            timerSettings (set in admin)
           timer/state                current timer state (written by the controller)
           timer/clock                used once per device to measure its clock against the server
         Every device works out the current phase from the state + time, so displays stay in sync
         and keep running if the connection drops for a moment. */
      const params = new URLSearchParams(location.search);
      const compId = params.get('comp');
      const mode = params.get('mode') === 'control' ? 'control' : 'display';
      if (params.get('embed')) document.body.classList.add('embed');
      const stateRef = compId && doc(db, 'competitions', compId, 'timer', 'state');

      const DEFAULTS = {
        shootSec: 240,
        callupSec: 10,
        warnSec: 30,
        ends: 12,
        practiceEnds: 2,
        lines: 'AB-CD', // 'AB' | 'AB-CD' | 'ALT'
      };
      let settings = { ...DEFAULTS };
      let compName = '';
      let state = null; // last state from Firebase
      let serverOffset = 0; // server time - device time (ms)
      const now = () => Date.now() + serverOffset;

      // Measure this device's clock against the server (so all screens show the same second)
      async function syncClock() {
        try {
          const ref = doc(db, 'competitions', compId, 'timer', 'clock');
          const t0 = Date.now();
          await setDoc(ref, { t: serverTimestamp() });
          const snap = await getDoc(ref);
          const t1 = Date.now();
          const server = cleanData(snap.data())?.t?.toMillis?.();
          if (server) serverOffset = server - (t0 + t1) / 2;
        } catch (e) {
          console.error('clock sync', e);
        }
      }

      /* ── FINALS (alternating): state.mode = 'alt', state.alt = { label, catKey, roundKey, format,
         names: [left, right], idx: [archer index on the left, on the right], starter 'L'|'R',
         sec, arrows, ends, callup } — set from the admin Timer panel. End ends+1 = shoot-off. */
      const isAlt = () => state?.mode === 'alt' && !!state.alt;
      const AL = () => state.alt;
      const altKeep = () => (isAlt() ? { mode: 'alt', alt: state.alt } : {});
      const sideName = (g) => (g === 'L' ? AL().names[0] : AL().names[1]) || g;

      /* ── sequence of one end ── */
      // Practice ends are not counted as ends: "PRACTICE ROUND" (numbered if there is more than one)
      const isPractice = (e) => !isAlt() && e <= settings.practiceEnds;
      const endLabel = (e) => {
        if (isAlt()) return e > AL().ends ? 'SHOOT-OFF' : `END ${e} / ${AL().ends}`;
        if (isPractice(e))
          return settings.practiceEnds > 1
            ? `PRACTICE ROUND ${e}/${settings.practiceEnds}`
            : 'PRACTICE ROUND';
        return `END ${e - settings.practiceEnds} / ${settings.ends}`;
      };
      const startLabel = (e) => {
        if (isAlt()) return e > AL().ends ? 'SHOOT-OFF' : `END ${e}`;
        return isPractice(e) ? endLabel(e) : `END ${e - settings.practiceEnds}`;
      };
      const totalEnds = () => (isAlt() ? AL().ends + 1 : settings.practiceEnds + settings.ends);
      function groupsForEnd(e) {
        if (settings.lines === 'AB') return ['AB'];
        if (settings.lines === 'ALT') {
          const n = e <= settings.practiceEnds ? e : e - settings.practiceEnds;
          return n % 2 === 1 ? ['AB', 'CD'] : ['CD', 'AB'];
        }
        return ['AB', 'CD'];
      }
      function buildSeq(e) {
        const seq = [];
        if (isAlt()) {
          // call-up, then one arrow each in turn, starting with the chosen archer
          const a = AL();
          const first = a.starter === 'R' ? 'R' : 'L';
          const other = first === 'L' ? 'R' : 'L';
          const n = e > a.ends ? 1 : a.arrows;
          if (a.callup > 0) seq.push({ phase: 'callup', group: first, dur: a.callup, beeps: 2 });
          for (let i = 0; i < n; i++) {
            seq.push({ phase: 'shoot', group: first, dur: a.sec, beeps: 1 });
            seq.push({ phase: 'shoot', group: other, dur: a.sec, beeps: 1 });
          }
          return seq;
        }
        groupsForEnd(e).forEach((g) => {
          seq.push({ phase: 'callup', group: g, dur: settings.callupSec, beeps: 2 });
          seq.push({ phase: 'shoot', group: g, dur: settings.shootSec, beeps: 1 });
        });
        return seq;
      }

      /* ── where are we now? (same answer on every device) ── */
      function current() {
        const s = state;
        if (!s || !s.status || s.status === 'idle') return { kind: 'idle', end: s?.end || 1 };
        if (s.status === 'ready') return { kind: 'ready', end: s.end };
        if (s.status === 'collect') return { kind: 'collect', end: s.end };
        if (s.status === 'paused' || s.status === 'emergency') {
          const seg = s.seq[s.segIndex];
          return { kind: s.status, end: s.end, segIndex: s.segIndex, seg, remaining: s.remaining };
        }
        // running: walk forward through the segments
        let i = s.segIndex;
        let elapsed = (now() - s.segStartedAt) / 1000;
        while (i < s.seq.length && elapsed >= s.seq[i].dur) {
          elapsed -= s.seq[i].dur;
          i++;
        }
        if (i >= s.seq.length) return { kind: 'collect', end: s.end, auto: true };
        return {
          kind: 'running',
          end: s.end,
          segIndex: i,
          seg: s.seq[i],
          remaining: s.seq[i].dur - elapsed,
        };
      }

      /* ── sound (Web Audio beeps) ── */
      let soundOn = false,
        audioCtx = null;
      window.toggleSound = () => {
        soundOn = !soundOn;
        if (soundOn && !audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx?.state === 'suspended') audioCtx.resume();
        const label = soundOn ? '🔊 SOUND ON' : '🔇 SOUND OFF';
        const b1 = document.getElementById('btn-sound');
        const b2 = document.getElementById('btn-sound-c');
        const b3 = document.getElementById('btn-sound-a');
        if (b3) b3.textContent = label;
        if (b1) b1.textContent = label;
        if (b2) b2.textContent = label + ' ON THIS DEVICE';
        if (soundOn) beep(1);
      };
      function beep(n) {
        if (!soundOn || !audioCtx) return;
        const t0 = audioCtx.currentTime + 0.02;
        for (let i = 0; i < n; i++) {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'square';
          o.frequency.value = 880;
          const st = t0 + i * 0.9;
          g.gain.setValueAtTime(0.0001, st);
          g.gain.exponentialRampToValueAtTime(0.6, st + 0.02);
          g.gain.setValueAtTime(0.6, st + 0.55);
          g.gain.exponentialRampToValueAtTime(0.0001, st + 0.6);
          o.connect(g).connect(audioCtx.destination);
          o.start(st);
          o.stop(st + 0.62);
        }
      }

      /* ── render loop: draw + play beeps when entering a new phase ── */
      let lastKey = null,
        lastManualBeep = undefined;
      // time shown in whole seconds (e.g. 152), not m:ss
      const fmt = (sec) => String(Math.max(0, Math.ceil(sec)));
      function view() {
        const c = current();
        let color = 'c-red',
          time = '--',
          phase = '',
          group = '';
        const endTxt = endLabel(c.end);
        if (c.kind === 'idle') {
          color = 'c-idle';
          phase = 'WAITING';
        } else if (c.kind === 'ready') {
          phase = 'READY';
          time = fmt(settings.callupSec);
        } else if (c.kind === 'collect') {
          phase = 'COLLECT ARROWS';
          time = '0';
        } else {
          group = c.seg.group;
          time = fmt(c.remaining);
          if (c.kind === 'emergency') phase = '⛔ STOP';
          else if (c.kind === 'paused') phase = 'PAUSED';
          else phase = c.seg.phase === 'callup' ? 'TO THE LINE' : 'SHOOT';
          const warn = isAlt() ? 5 : settings.warnSec;
          if (c.kind === 'running' && c.seg.phase === 'shoot')
            color = c.remaining <= warn ? 'c-yellow' : 'c-green';
          if (isAlt()) group = sideName(c.seg.group);
          if (c.kind === 'paused' && c.seg.phase === 'shoot') color = 'c-yellow';
        }
        let next = '';
        if (c.kind === 'running' || c.kind === 'paused') {
          const s = state.seq[c.segIndex + 1];
          next = s
            ? isAlt()
              ? `Next: ${sideName(s.group)}`
              : `Next: ${s.group} ${s.phase === 'callup' ? 'to the line' : 'shoot'}`
            : 'Next: collect';
        }
        return { c, color, time, phase, group, endTxt, next };
      }
      let stateLoaded = false;
      function soundEvents(c) {
        if (!stateLoaded) return;
        // beeps when the phase changes (not on first load, so a reloaded screen stays quiet)
        const key =
          c.kind === 'running'
            ? `${state.end}-${state.startId}-${c.segIndex}`
            : `${c.kind}-${state?.end}-${state?.startId}`;
        if (key !== lastKey) {
          if (lastKey !== null) {
            if (c.kind === 'running') beep(c.seg.beeps);
            else if (c.kind === 'collect') beep(3);
            else if (c.kind === 'emergency') beep(5);
          }
          lastKey = key;
        }
        // manual beeps: play when a new one arrives (not the one already there on load)
        const mbId = state?.manualBeep?.id || null;
        if (lastManualBeep === undefined) lastManualBeep = mbId;
        else if (mbId && mbId !== lastManualBeep) {
          beep(state.manualBeep.n);
          lastManualBeep = mbId;
        }
      }
      function draw() {
        const v = view();
        soundEvents(v.c);
        if (mode === 'display' && isAlt()) {
          document.getElementById('display').style.display = 'none';
          document.getElementById('alt').style.display = 'flex';
          drawAlt(v);
        } else if (mode === 'display') {
          document.getElementById('display').style.display = 'flex';
          document.getElementById('alt').style.display = 'none';
          const d = document.getElementById('display');
          d.className = v.color;
          document.getElementById('d-time').textContent = v.time;
          document.getElementById('d-phase').textContent = v.phase;
          document.getElementById('d-group').textContent = v.group;
          document.getElementById('d-end').textContent = v.endTxt;
          document.getElementById('d-comp').textContent = compName;
          document.getElementById('d-next').textContent = v.next;
        } else {
          const st = document.getElementById('c-status');
          st.className = 'c-status ' + (v.color === 'c-idle' ? '' : v.color);
          document.getElementById('c-time').textContent = v.time;
          document.getElementById('c-info').textContent =
            `${v.endTxt}${v.group ? ' · ' + v.group : ''}`;
          document.getElementById('c-sub').textContent = [v.phase, v.next]
            .filter(Boolean)
            .join(' · ');
          const k = v.c.kind;
          const main = document.getElementById('btn-main');
          if (k === 'idle' || k === 'ready') main.textContent = `▶ START ${startLabel(v.c.end)}`;
          else if (k === 'collect')
            main.textContent =
              v.c.end < totalEnds() ? `▶ START ${startLabel(v.c.end + 1)}` : '✓ ALL ENDS DONE';
          else if (k === 'running' && isAlt()) {
            const nx = state.seq[v.c.segIndex + 1];
            main.textContent =
              v.c.seg.phase === 'callup'
                ? `⏭ START ${sideName(v.c.seg.group)} NOW`
                : nx
                  ? `⏭ ARROW SHOT → ${sideName(nx.group)}`
                  : '⏭ ARROW SHOT → END';
          } else if (k === 'running') main.textContent = '⏭ NEXT (END PHASE NOW)';
          else main.textContent = '▶ RESUME';
          const canAdjust = k === 'paused' || k === 'emergency';
          document.querySelectorAll('#adj-btns button').forEach((b) => (b.disabled = !canAdjust));
          document.getElementById('btn-pause').textContent =
            k === 'paused' || k === 'emergency' ? '▶ RESUME' : '⏸ PAUSE';
          // finals: who starts the next end (by the rules: the archer behind starts)
          const sr = document.getElementById('starter-row');
          const canPick = isAlt() && (k === 'idle' || k === 'ready' || k === 'collect');
          sr.style.display = canPick ? 'grid' : 'none';
          if (canPick) {
            ['L', 'R'].forEach((g) => {
              const b = document.getElementById('btn-start-' + g);
              b.textContent = `${g === 'L' ? '◀ ' : ''}${sideName(g)} STARTS${g === 'R' ? ' ▶' : ''}`;
              b.classList.toggle('on', (AL().starter || 'L') === g);
            });
          }
          if (isAlt())
            document.getElementById('c-info').textContent =
              `${AL().label} · ${v.endTxt}${v.group ? ' · ' + v.group : ''}`;
        }
      }

      /* ── finals display: two sides, live score from the match being scored on the phones ── */
      let matchWatch = { key: null, unsub: null, m: null };
      function watchAltMatch() {
        const key = isAlt() ? `${AL().catKey}~${AL().roundKey}` : null;
        if (key === matchWatch.key) return;
        if (matchWatch.unsub) matchWatch.unsub();
        matchWatch = { key, unsub: null, m: null };
        if (!key) return;
        const id = encodeURIComponent(AL().catKey) + '~' + AL().roundKey + '~0';
        matchWatch.unsub = onSnapshot(doc(db, 'competitions', compId, 'matches', id), (snap) => {
          const d = cleanData(snap.data()) || {};
          matchWatch.m = d.match || d;
          draw();
        });
      }
      const arrowVal = (v) => (v === 'X' ? 10 : parseInt(v) || 0);
      const sum = (arr) => (arr || []).reduce((t, v) => t + arrowVal(v), 0);
      // per archer index (0 = archer1, 1 = archer2): big number (set points or total) + this end's arrows
      function altScore(end) {
        const m = matchWatch.m;
        if (!m) return null;
        const a = AL();
        const per = a.arrows;
        const shootOff = end > a.ends;
        if (a.format === 'sets') {
          const sets = m.sets || [];
          const any = sets.some((x) => x && ((x.arrows1 || []).length || (x.arrows2 || []).length));
          if (!any) return null;
          const pts = [0, 0];
          sets.slice(0, a.ends).forEach((x) => {
            if (!x) return;
            const a1 = x.arrows1 || [],
              a2 = x.arrows2 || [];
            if (a1.length < per || a2.length < per) return;
            const s1 = sum(a1),
              s2 = sum(a2);
            if (s1 > s2) pts[0] += 2;
            else if (s2 > s1) pts[1] += 2;
            else {
              pts[0] += 1;
              pts[1] += 1;
            }
          });
          const cur = sets[shootOff ? a.ends : end - 1] || {};
          return [0, 1].map((i) => ({
            big: pts[i],
            label: 'SET POINTS',
            arrows: (i === 0 ? cur.arrows1 : cur.arrows2) || [],
          }));
        }
        const arr = [m.arrows1 || [], m.arrows2 || []];
        const tb = [m.tiebreak1, m.tiebreak2];
        if (!arr[0].length && !arr[1].length) return null;
        return [0, 1].map((i) => ({
          big: sum(arr[i]),
          label: 'TOTAL',
          arrows: shootOff
            ? tb[i] !== null && tb[i] !== undefined
              ? [tb[i]]
              : []
            : arr[i].slice((end - 1) * per, end * per),
        }));
      }
      function drawAlt(v) {
        watchAltMatch();
        const a = AL();
        const c = v.c;
        const wrap = document.getElementById('alt');
        const red =
          c.kind === 'collect' || c.kind === 'emergency' || (c.seg && c.seg.phase === 'callup');
        wrap.className = red ? 'c-red' : '';
        document.getElementById('a-label').textContent = a.label;
        document.getElementById('a-end').textContent = v.endTxt;
        const score = altScore(c.end);
        ['L', 'R'].forEach((g, si) => {
          const el = document.getElementById('a-' + g);
          const active =
            c.seg &&
            c.seg.group === g &&
            (c.kind === 'running' || c.kind === 'paused' || c.kind === 'emergency');
          let cls = '';
          let clock = 'WAIT';
          if (active && c.seg.phase === 'shoot') {
            cls = c.kind === 'emergency' ? 'c-red' : v.color;
            clock = v.time;
          } else if (active && c.seg.phase === 'callup') {
            clock = v.time;
          }
          if (c.kind === 'emergency') clock = active ? '⛔ ' + v.time : '⛔';
          if (c.kind === 'collect') clock = '';
          if ((c.kind === 'ready' || c.kind === 'idle') && (a.starter || 'L') === g)
            clock = 'STARTS';
          el.className = 'a-side ' + cls;
          el.querySelector('.a-name').textContent = a.names[si] || '';
          const ck = el.querySelector('.a-clock');
          ck.textContent = clock;
          ck.className = 'a-clock' + (/^\d+$/.test(clock) ? '' : ' wait');
          const sc = score && score[a.idx[si]];
          el.querySelector('.a-pts').innerHTML = sc ? `${sc.big}<small>${sc.label}</small>` : '';
          el.querySelector('.a-arrows').innerHTML = sc
            ? Array.from(
                { length: c.end > a.ends ? 1 : a.arrows },
                (_, i) => `<span>${sc.arrows[i] ?? ''}</span>`,
              ).join('') + `<b>${sc.arrows.length ? sum(sc.arrows) : ''}</b>`
            : '';
        });
        const m = matchWatch.m;
        document.getElementById('a-note').textContent = score
          ? m && m.winnerChoice
            ? '✓ RESULT APPROVED'
            : 'PROVISIONAL SCORE — official result after the judge approves'
          : v.phase === 'COLLECT ARROWS'
            ? 'COLLECT ARROWS'
            : '';
      }

      /* ── controller actions (write the new state) ── */
      const write = (s) => setDoc(stateRef, { ...s, updatedAt: now() });
      const startId = () => Math.random().toString(36).slice(2, 8);
      function startEnd(e) {
        return write({
          ...altKeep(),
          status: 'running',
          end: e,
          seq: buildSeq(e),
          segIndex: 0,
          segStartedAt: now(),
          startId: startId(),
          manualBeep: state?.manualBeep || null,
        });
      }
      window.mainAction = () => {
        const c = current();
        if (c.kind === 'idle' || c.kind === 'ready') return startEnd(c.end || 1);
        if (c.kind === 'collect') {
          if (c.end < totalEnds()) return startEnd(c.end + 1);
          return;
        }
        if (c.kind === 'running') {
          // end the current phase now
          const nextIdx = c.segIndex + 1;
          if (nextIdx >= state.seq.length) return write({ ...state, status: 'collect' });
          return write({ ...state, segIndex: nextIdx, segStartedAt: now() });
        }
        return pauseResume();
      };
      window.pauseResume = () => {
        const c = current();
        if (c.kind === 'running')
          return write({
            ...state,
            status: 'paused',
            segIndex: c.segIndex,
            remaining: c.remaining,
          });
        if (c.kind === 'paused' || c.kind === 'emergency') {
          const seg = state.seq[state.segIndex];
          return write({
            ...state,
            status: 'running',
            segStartedAt: now() - (seg.dur - state.remaining) * 1000,
            remaining: null,
          });
        }
      };
      window.emergency = () => {
        const c = current();
        if (c.kind === 'running' || c.kind === 'paused')
          return write({
            ...state,
            status: 'emergency',
            segIndex: c.segIndex,
            remaining: c.remaining,
          });
        return write({
          ...(state || {}),
          ...altKeep(),
          status: 'emergency',
          end: c.end || 1,
          seq: state?.seq || buildSeq(c.end || 1),
          segIndex: 0,
          remaining: settings.callupSec,
        });
      };
      window.adjust = (sec) => {
        const c = current();
        // time can only be changed while the end is paused / emergency-stopped
        if (c.kind === 'paused' || c.kind === 'emergency') {
          return write({
            ...state,
            remaining: Math.max(0, state.remaining + sec),
          });
        }
      };
      window.restartEnd = () => {
        const c = current();
        return write({
          ...altKeep(),
          status: 'ready',
          end: c.end || 1,
          manualBeep: state?.manualBeep || null,
        });
      };
      window.jumpEnd = () => {
        const e = parseInt(document.getElementById('jump-end').value);
        if (!e) return;
        return write({
          ...altKeep(),
          status: 'ready',
          end: e,
          manualBeep: state?.manualBeep || null,
        });
      };
      window.setStarter = (g) => {
        if (!isAlt()) return;
        const k = current().kind;
        if (k === 'running' || k === 'paused' || k === 'emergency') return;
        return write({ ...state, alt: { ...state.alt, starter: g } });
      };
      window.manualBeep = (n) =>
        write({ ...(state || { status: 'idle', end: 1 }), manualBeep: { n, id: startId() } });

      window.goFullscreen = () => document.documentElement.requestFullscreen?.();

      function fillJump() {
        const sel = document.getElementById('jump-end');
        if (!sel) return;
        const cur = sel.value;
        sel.innerHTML = Array.from({ length: totalEnds() }, (_, i) => i + 1)
          .map((e) => `<option value="${e}">${endLabel(e)}</option>`)
          .join('');
        if (cur) sel.value = cur;
      }

      async function init() {
        if (!compId) {
          const m = document.getElementById('msg');
          m.style.display = 'block';
          m.textContent = 'No competition selected. Open the timer from the admin Timer panel.';
          return;
        }
        document.getElementById(mode).style.display = mode === 'display' ? 'flex' : 'block';
        onSnapshot(doc(db, 'competitions', compId), (snap) => {
          const d = cleanData(snap.data()) || {};
          compName = d.name || '';
          settings = { ...DEFAULTS, ...(d.timerSettings || {}) };
          fillJump();
          draw();
        });
        onSnapshot(stateRef, (snap) => {
          state = cleanData(snap.data()) || null;
          stateLoaded = true;
          fillJump();
          draw();
        });
        await syncClock();
        setInterval(syncClock, 5 * 60 * 1000);
        setInterval(draw, 200);
      }
      init();
    </script>
  </body>
</html>
