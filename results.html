<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ALL IN — Live Results</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --surface2: #1e1e1e;
        --border: #2a2a2a;
        --border2: #333;
        --accent: #ffd700;
        --text: #f0f0f0;
        --muted: #666;
        --muted2: #888;
        --green: #43a047;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Barlow', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        background: var(--surface);
        border-bottom: 2px solid var(--accent);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        gap: 12px;
        flex-wrap: wrap;
      }
      .header-logo {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 4px;
        color: var(--accent);
      }
      .header-comp {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 1px;
        flex: 1;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .live-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
        animation: pulse 1.5s infinite;
        display: inline-block;
        margin-right: 6px;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .live-label {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: var(--green);
        letter-spacing: 1px;
      }
      .header-time {
        font-size: 13px;
        color: var(--muted2);
      }
      .app-btn {
        background: #1a3300;
        border: 1px solid #43a047;
        color: #81c784;
        padding: 7px 14px;
        border-radius: 8px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .app-btn:hover {
        background: #1b5e20;
        border-color: #66bb6a;
        color: #fff;
      }
      body.auto .header {
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .main {
        flex: 1;
        padding: 20px;
        overflow: hidden;
      }
      .no-comp {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted2);
      }
      .no-comp .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      .no-comp p {
        font-size: 16px;
        line-height: 1.8;
      }
      .categories-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
      }
      .cat-block {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 12px;
        overflow: hidden;
        flex: 1;
        min-width: 260px;
        max-width: 420px;
      }
      .cat-header {
        padding: 10px 14px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 1px;
        border-bottom: 1px solid var(--border2);
      }
      .cat-table {
        width: 100%;
        border-collapse: collapse;
      }
      .cat-table tr {
        border-bottom: 1px solid var(--border);
      }
      .cat-table tr:last-child {
        border-bottom: none;
      }
      .cat-table td {
        padding: 8px 12px;
        font-size: 15px;
      }
      .rank-1 {
        color: #ffd700;
      }
      .rank-2 {
        color: #c0c0c0;
      }
      .rank-3 {
        color: #cd7f32;
      }
      .rank-n {
        color: var(--muted2);
      }
      .selector-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .selector-bar label {
        font-size: 12px;
        color: var(--muted2);
        font-weight: 600;
      }
      .selector-bar select {
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 6px;
        font-family: 'Barlow', sans-serif;
        font-size: 13px;
        outline: none;
      }
      .refresh-badge {
        font-size: 11px;
        color: var(--muted2);
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-logo">ALL IN</div>
      <div class="header-comp" id="comp-name">Select a competition below</div>
      <div class="header-right">
        <span><span class="live-dot"></span><span class="live-label">LIVE</span></span>
        <span class="header-time" id="clock"></span>
        <a href="scoring.html" class="app-btn">🏠 SCORING APP</a>
      </div>
    </div>

    <div class="selector-bar">
      <label id="results-comp-label">COMPETITION:</label>
      <select id="comp-select" onchange="selectComp(this.value)">
        <option value="">— Select —</option>
      </select>
      <div id="view-toggle" style="display: none; gap: 6px; display: flex">
        <button
          id="btn-qual"
          onclick="setView('qual')"
          style="
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #000;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
          "
        >
          🏹 QUALIFICATION
        </button>
        <button
          id="btn-elim"
          onclick="setView('elim')"
          style="
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--muted2);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
          "
        >
          ⚔️ ELIMINATION
        </button>
        <button
          id="btn-final"
          onclick="setView('final')"
          style="
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border2);
            background: transparent;
            color: var(--muted2);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
          "
        >
          🏆 FINAL RESULTS
        </button>
      </div>
      <button
        id="btn-auto"
        onclick="toggleAuto()"
        style="
          padding: 6px 14px;
          border-radius: 6px;
          border: 1px solid var(--border2);
          background: transparent;
          color: var(--muted2);
          font-family: 'Barlow Condensed', sans-serif;
          font-weight: 700;
          font-size: 12px;
          cursor: pointer;
        "
      >
        ▶ AUTO-SCROLL
      </button>
      <span class="refresh-badge" id="last-update"></span>
    </div>

    <div class="main" id="main">
      <div id="qual-content"></div>
      <div id="elim-content" style="display: none"></div>
      <div id="final-content" style="display: none"></div>
      <div class="no-comp">
        <div class="icon">🏆</div>
        <p id="results-no-comp-msg">Select a competition above<br />to show live results.</p>
      </div>
    </div>

    <script src="he-text.js" data-keep-ltr="#elim-content"></script>
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      import {
        getFirestore,
        collection,
        doc,
        getDocs,
        onSnapshot,
        getDoc,
        writeBatch,
        deleteDoc,
        setDoc,
      } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
      const liveConfig = {
        apiKey: 'AIzaSyBVDdelVGWJOgQZwN_Um6rppelcNYVN2To',
        authDomain: 'all-in-competition.firebaseapp.com',
        projectId: 'all-in-competition',
        storageBucket: 'all-in-competition.firebasestorage.app',
        messagingSenderId: '620146958631',
        appId: '1:620146958631:web:1e88019d1436372689c902',
      };
      const devConfig = {
        apiKey: 'AIzaSyDjmlQJbyRUXXFRlEfVMil0M_DFFUP5Fcc',
        authDomain: 'all-in-dev-f2807.firebaseapp.com',
        projectId: 'all-in-dev-f2807',
        storageBucket: 'all-in-dev-f2807.firebasestorage.app',
        messagingSenderId: '358306227588',
        appId: '1:358306227588:web:4e3ad05ffc3812415d69d1',
      };
      // Live data only on GitHub Pages; anywhere else (your computer) uses all-in-dev
      const firebaseConfig = location.hostname.endsWith('github.io') ? liveConfig : devConfig;
      const app = initializeApp(firebaseConfig);
      /* ── SAFE TEXT ──
         Everything read from Firebase goes through cleanData(): characters that could break the page
         or run code (< > " ' & ` \\) are swapped for look-alikes, e.g. O'Brien → O’Brien. */
      const UNSAFE = { '<': '‹', '>': '›', '"': '”', "'": '’', '&': '＆', '`': 'ʹ', '\\': '∖' };
      const cleanText = (s) => String(s).replace(/[<>"'&`\\]/g, (ch) => UNSAFE[ch]);
      function cleanData(v) {
        if (typeof v === 'string') return cleanText(v);
        if (Array.isArray(v)) return v.map(cleanData);
        if (v && typeof v === 'object') {
          if (typeof v.toMillis === 'function') return v; // Firestore timestamp
          const o = {};
          Object.keys(v).forEach((k) => (o[k] = cleanData(v[k])));
          return o;
        }
        return v;
      }
      const db = getFirestore(app);
      /* ── DATA LAYOUT ──
         competitions/{id}            settings (name, date, discipline, targets, sessions, targetConfig…)
           archers/{archerId}         public archer info
           contacts/{archerId}        phone, email (admin only)
           scores/{archerId}          qualification score
           brackets/{catKey}          elimination bracket settings + roundCounts
           matches/{catKey~round~i}   one elimination match
         Pages rebuild the old in-memory shape ({archers:[], scores:{}, elimination:{}}) from these. */
      const compRef = (id) => doc(db, 'competitions', id);
      const sub = (id, name) => collection(db, 'competitions', id, name);
      const safeId = (s) => encodeURIComponent(String(s));
      const matchDocId = (catKey, roundKey, idx) => safeId(catKey) + '~' + roundKey + '~' + idx;
      const archerSortKey = (a) =>
        a.registeredAt ? Date.parse(a.registeredAt) : Number(a.id) || 0;
      function buildArchers(archerDocs, contactDocs) {
        const contacts = {};
        (contactDocs || []).forEach((d) => (contacts[d.id] = cleanData(d.data())));
        return archerDocs
          .map((d) => ({ ...cleanData(d.data()), ...(contacts[d.id] || {}), id: d.id }))
          .filter((a) => !a.dns) // DNS archers are not shown on this page
          .sort((a, b) => archerSortKey(a) - archerSortKey(b));
      }
      function buildScores(scoreDocs) {
        const s = {};
        scoreDocs.forEach((d) => (s[d.id] = cleanData(d.data())));
        return s;
      }
      function buildElimination(bracketDocs, matchDocs) {
        const elim = {};
        bracketDocs.forEach((d) => {
          const { catKey, roundCounts, ...meta } = cleanData(d.data());
          const rounds = {};
          Object.entries(roundCounts || {}).forEach(
            ([rk, n]) => (rounds[rk] = new Array(n).fill(undefined)),
          );
          elim[catKey] = { ...meta, rounds };
        });
        matchDocs.forEach((d) => {
          const { catKey, roundKey, idx, match } = cleanData(d.data());
          const r = elim[catKey]?.rounds[roundKey];
          if (r && idx < r.length) r[idx] = match;
        });
        // A bracket whose matches haven't all arrived yet is left out until they do
        Object.keys(elim).forEach((ck) => {
          if (Object.values(elim[ck].rounds).some((r) => r.some((m) => m === undefined)))
            delete elim[ck];
        });
        return elim;
      }
      function assembleComp(compSnap, archerDocs, contactDocs, scoreDocs, bracketDocs, matchDocs) {
        return {
          ...cleanData(compSnap.data()),
          archers: buildArchers(archerDocs, contactDocs),
          scores: buildScores(scoreDocs),
          elimination: buildElimination(bracketDocs, matchDocs),
        };
      }
      // One-time read of a whole competition
      async function loadComp(id, withContacts = false) {
        const [c, a, ct, s, b, m] = await Promise.all([
          getDoc(compRef(id)),
          getDocs(sub(id, 'archers')),
          withContacts ? getDocs(sub(id, 'contacts')) : Promise.resolve({ docs: [] }),
          getDocs(sub(id, 'scores')),
          getDocs(sub(id, 'brackets')),
          getDocs(sub(id, 'matches')),
        ]);
        if (!c.exists()) return null;
        return assembleComp(c, a.docs, ct.docs, s.docs, b.docs, m.docs);
      }
      // Live listener on a whole competition; returns an unsubscribe function
      function watchComp(id, withContacts, onData) {
        const parts = {
          comp: null,
          archers: null,
          contacts: withContacts ? null : [],
          scores: null,
          brackets: null,
          matches: null,
        };
        const emit = () => {
          if (Object.values(parts).some((v) => v === null)) return;
          if (!parts.comp.exists()) return onData(null);
          onData(
            assembleComp(
              parts.comp,
              parts.archers,
              parts.contacts,
              parts.scores,
              parts.brackets,
              parts.matches,
            ),
          );
        };
        const names = ['archers', 'scores', 'brackets', 'matches'];
        if (withContacts) names.push('contacts');
        const unsubs = [
          onSnapshot(compRef(id), (s) => {
            parts.comp = s;
            emit();
          }),
          ...names.map((name) =>
            onSnapshot(sub(id, name), (s) => {
              parts[name] = s.docs;
              emit();
            }),
          ),
        ];
        return () => unsubs.forEach((u) => u());
      }
      // Run write operations in batches (Firestore max 500 per batch)
      async function commitOps(ops) {
        for (let i = 0; i < ops.length; i += 400) {
          const b = writeBatch(db);
          ops.slice(i, i + 400).forEach((op) => op(b));
          await b.commit();
        }
      }
      // Delete a competition and everything under it
      async function deleteCompDeep(id) {
        for (const name of ['archers', 'contacts', 'scores', 'brackets', 'matches']) {
          const snap = await getDocs(sub(id, name));
          await commitOps(snap.docs.map((d) => (b) => b.delete(d.ref)));
        }
        await deleteDoc(compRef(id));
      }
      let currentLang = 'en';
      window.t = function (key) {
        return T[currentLang]?.[key] || T['en']?.[key] || key;
      };
      function t(key) {
        return window.t(key);
      }
      const T = {
        en: {
          live: 'LIVE',
          select_comp: 'Select a competition below',
          select_above: 'Select a competition above',
          to_show: 'to show live results.',
          competition: 'COMPETITION:',
          qualification: '🏹 QUALIFICATION',
          elimination: '⚔️ ELIMINATION',
          updated: 'Updated',
          no_scores: 'No scores yet.',
          results_appear: 'Results will appear here as archers complete their rounds.',
          name: 'NAME',
          score: 'SCORE',
          men: 'MEN',
          women: 'WOMEN',
          round_of: 'Round of',
          quarter_finals: 'Quarter Finals',
          semi_finals: 'Semi Finals',
          final: 'Final',
          bronze: 'Bronze Medal',
          set_system: 'Set System',
          cumulative: 'Cumulative',
          pending: 'PENDING',
          select: '— Select —',
          archers: 'archers',
          tbd: 'TBD',
          closest_center: 'TIED — WHO IS CLOSEST TO CENTER?',
          closer_center: 'Closer to center?',
          final_results: '🏆 FINAL RESULTS',
          provisional: 'PROVISIONAL WINNER',
          final_results_title: 'Final Results',
          in_progress: 'Elimination in progress',
          qual_rank: 'QUAL',
          club: 'Club',
          print: 'PRINT',
        },
        he: {
          live: 'חי',
          select_comp: 'בחרו תחרות למטה',
          select_above: 'בחרו תחרות למעלה',
          to_show: 'להצגת תוצאות חיות.',
          competition: 'תחרות:',
          qualification: '🏹 מוקדמות',
          elimination: '⚔️ מקצי הדחות',
          updated: 'עודכן',
          no_scores: 'אין ניקוד עדיין.',
          results_appear: 'התוצאות יופיעו כאן לאחר סיום הניקוד.',
          name: 'שם',
          score: 'ניקוד',
          men: 'גברים',
          women: 'נשים',
          round_of: 'סיבוב',
          quarter_finals: 'רבע גמר',
          semi_finals: 'חצי גמר',
          final: 'גמר',
          bronze: 'מקצה ארד',
          set_system: 'שיטת סטים',
          cumulative: 'צבירה',
          pending: 'ממתין',
          select: '— בחרו —',
          archers: 'קשתים',
          tbd: 'טרם נקבע',
          closest_center: 'שוויון — מי קרוב יותר למרכז?',
          closer_center: 'קרוב יותר למרכז?',
          final_results: '🏆 תוצאות סופיות',
          provisional: 'מנצח זמני',
          final_results_title: 'תוצאות סופיות',
          in_progress: 'מקצי ההדחות עדיין בתהליך',
          qual_rank: 'מוקדמות',
          club: 'מועדון',
          print: 'הדפסה',
        },
      };
      function initResultsLang() {
        const saved =
          localStorage.getItem('adminLang') || localStorage.getItem('scoringLang') || 'en';
        currentLang = saved;
        if (window.HeText) HeText.setLang(currentLang);
        applyResultsTranslations();
      }
      function applyResultsTranslations() {
        const lang = currentLang;
        const tr = (key) => T[lang]?.[key] || T['en']?.[key] || key;
        const compName = document.getElementById('comp-name');
        if (
          compName &&
          (compName.textContent === T['en']['select_comp'] ||
            compName.textContent === T['he']['select_comp'])
        )
          compName.textContent = tr('select_comp');
        const compLabel = document.querySelector('.selector-bar label');
        if (compLabel) compLabel.textContent = tr('competition');
        const sel = document.getElementById('comp-select');
        if (sel && sel.options[0]) sel.options[0].textContent = tr('select');
        const btnQual = document.getElementById('btn-qual');
        const btnElim = document.getElementById('btn-elim');
        if (btnQual) btnQual.textContent = tr('qualification');
        if (btnElim) btnElim.textContent = tr('elimination');
        const btnFinal = document.getElementById('btn-final');
        if (btnFinal) btnFinal.textContent = tr('final_results');
        const noCompP = document.getElementById('results-no-comp-msg');
        if (noCompP) noCompP.innerHTML = tr('select_above') + '<br>' + tr('to_show');
        const liveLabel = document.querySelector('.live-label');
        if (liveLabel) liveLabel.textContent = tr('live');
      }
      const BOW_ORDER = ['Recurve', 'Compound', 'Barebow', 'Traditional', 'Longbow'];
      const AGE_ORDER = ['U12', 'U14', 'U18', 'U21', 'Senior', 'Master 50+', 'Master 60+'];
      const BOW_COLORS = {
        Recurve: '#1565c0',
        Compound: '#4a148c',
        Barebow: '#1b5e20',
        Traditional: '#e65100',
        Longbow: '#37474f',
      };
      let unsubscribe = null;
      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      }, 1000);
      function renderElimDisplay(elimData, discipline) {
        const main = document.getElementById('elim-content');
        const scrollTop = main.scrollTop;
        const roundOrder = ['R1', 'QF', 'SF', 'F', 'B'];
        const getRLabel = (rk, bs) => {
          if (rk === 'R1') return t('round_of') + ' ' + (bs * 2 || 16);
          if (rk === 'QF') return t('quarter_finals');
          if (rk === 'SF') return t('semi_finals');
          if (rk === 'F') return '🏆 ' + t('final');
          if (rk === 'B') return '🥉 ' + t('bronze');
          return rk;
        };
        let html = '<div style="display:flex;flex-direction:column;gap:20px;">';
        Object.entries(elimData)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .forEach(([catKey, data]) => {
            const gLabel = data.gender === 'M' ? t('men').toUpperCase() : t('women').toUpperCase();
            const formatLabel = data.format === 'sets' ? t('set_system') : t('cumulative');
            html += `<div><div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:2px;color:var(--accent);padding:8px 0 12px;">${data.bow.toUpperCase()} · ${data.age} · ${gLabel}<span style="font-size:12px;color:var(--muted2);font-weight:400;margin-left:12px;">${formatLabel}</span></div><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;">`;
            roundOrder.forEach((rk) => {
              const matches = data.rounds?.[rk];
              if (!matches || !matches.length) return;
              const label = getRLabel(rk, data.bracketSize);
              html += `<div style="flex:1;min-width:240px;max-width:380px;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border2);">${label}</div><div style="display:flex;flex-direction:column;gap:8px;">`;
              matches.forEach((match) => {
                const done = !!match.winnerChoice;
                const w1 =
                  match.winnerChoice && String(match.winnerChoice) === String(match.archer1?.id);
                const w2 =

              const rankLabel = medalText(p, placeText(p));

                ? `<td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted2);text-align:center;padding:6px 4px;min-width:32px;">${a.h1 || 0}</td><td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted2);text-align:center;padding:6px 4px;min-width:32px;">${a.h2 || 0}</td>`
                : '';
              return `<tr><td style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;text-align:center;padding:6px 6px;width:32px;" class="${rankClass}">${rankLabel}</td><td style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;padding:6px 8px;white-space:nowrap;">${a.name}</td>${h1h2}<td style="font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;color:var(--accent);text-align:center;padding:6px 8px;min-width:46px;">${a.total}</td><td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted2);text-align:center;padding:6px 4px;min-width:32px;">${isCustomDisc ? a.kills || 0 : a.g1 || 0}</td><td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted2);text-align:center;padding:6px 4px;min-width:32px;">${isCustomDisc ? a.elevens || 0 : a.g2 || 0}</td>${isCustomDisc ? `<td style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted2);text-align:center;padding:6px 4px;min-width:32px;">${a.sixes || 0}</td>` : ''}</tr>`;
            })
            .join('');
          const colHeaders = showHalves
            ? `<tr style="border-bottom:1px solid var(--border2);"><td style="width:36px;"></td><td style="font-size:10px;color:var(--muted);padding:3px 10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px;">${t('name')}</td><td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">H1</td><td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">H2</td><td style="font-size:10px;color:var(--muted);padding:3px 10px;text-align:center;font-family:'Barlow Condensed',sans-serif;">${t('score')}</td><td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">X</td><td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">10</td></tr>`
            : `<tr style="border-bottom:1px solid var(--border2);"><td style="width:36px;"></td><td style="font-size:10px;color:var(--muted);padding:3px 10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px;">${t('name')}</td><td style="font-size:10px;color:var(--muted);padding:3px 10px;text-align:center;font-family:'Barlow Condensed',sans-serif;">${t('score')}</td><td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">${g1label}</td><td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">${g2label}</td>${isCustomDisc ? `<td style="font-size:10px;color:var(--muted);padding:3px 6px;text-align:center;font-family:'Barlow Condensed',sans-serif;">6s</td>` : ''}</tr>`;
          return `<div class="cat-block"><div class="cat-header" style="background:${color}33;color:${color};border-bottom:2px solid ${color}44;">${cat.bow.toUpperCase()} · ${cat.age} · ${gLabel}</div><table class="cat-table"><tbody>${colHeaders}${rows}</tbody></table></div>`;
        }
        renderFinalResults(cats, elimData, disc);
        let html = '<div style="display:flex;flex-direction:column;gap:20px;">';
        BOW_ORDER.forEach((bow) => {
          const group = bowGroups[bow] || [];
          if (!group.length) return;
          const color = BOW_COLORS[bow] || '#555';
          html += `<div><div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;color:${color};padding:4px 0 8px;border-bottom:1px solid ${color}33;margin-bottom:10px;text-transform:uppercase;">${bow}</div><div class="categories-grid">${group.map(buildCatBlock).join('')}</div></div>`;
        });
        html += '</div>';
        const qualContent = document.getElementById('qual-content');
        if (qualContent) qualContent.innerHTML = html;
      }
      loadComps();
      initResultsLang();
    </script>
  </body>
</html>
