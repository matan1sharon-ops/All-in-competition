<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ALL IN — Competition History</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --surface2: #1e1e1e;
        --surface3: #252525;
        --border: #2a2a2a;
        --border2: #333;
        --accent: #ffd700;
        --text: #f0f0f0;
        --muted: #666;
        --muted2: #888;
        --green: #43a047;
        --red: #e53935;
        --blue: #1e88e5;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Barlow', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .header {
        background: var(--surface);
        border-bottom: 2px solid var(--accent);
        padding: 16px 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .logo {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 4px;
        color: var(--accent);
      }
      .header-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--muted2);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .back-btn {
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 8px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        display: none;
      }
      .back-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .app-btn {
        margin-left: auto;
        background: #1a3300;
        border: 1px solid #43a047;
        color: #81c784;
        padding: 8px 16px;
        border-radius: 8px;
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .app-btn:hover {
        background: #1b5e20;
        border-color: #66bb6a;
        color: #fff;
      }
      .content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px;
      }
      .comp-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }
      .comp-card {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 20px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          transform 0.1s;
      }
      .comp-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .comp-card-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 20px;
        font-weight: 900;
        color: var(--text);
        margin-bottom: 8px;
      }
      .comp-card-meta {
        font-size: 12px;
        color: var(--muted2);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .comp-card-meta span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .comp-card-footer {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .comp-card-archers {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--accent);
      }
      .comp-card-disc {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        background: var(--surface2);
        color: var(--muted2);
      }
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted2);
      }
      .empty-state .icon {
        font-size: 56px;
        margin-bottom: 16px;
      }
      .empty-state p {
        font-size: 15px;
        line-height: 1.8;
      }
      .comp-detail {
        display: none;
      }
      .comp-detail-header {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        padding: 20px 24px;
        margin-bottom: 24px;
      }
      .comp-detail-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 28px;
        font-weight: 900;
        color: var(--accent);
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .comp-detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .meta-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted2);
      }
      .meta-item strong {
        color: var(--text);
      }
      .section {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: var(--radius);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .section-title {
        padding: 14px 20px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text);
        border-inline-start: 4px solid var(--accent);
        border-bottom: 1px solid var(--border);
        background: var(--surface2);
      }
      html[dir='rtl'] .section-title {
        letter-spacing: 0.3px;
      }
      .section-body {
        padding: 16px 20px;
      }
      .cat-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cat-pill {
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--border2);
        background: var(--surface2);
        color: var(--muted2);
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .cat-pill:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .cat-pill.open {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }
      .cat-panel {
        display: none;
        margin-top: 12px;
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 8px;
        overflow: hidden;
      }
      .cat-panel.open {
        display: block;
      }
      table.qual-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.qual-table thead tr {
        background: var(--surface3);
      }
      table.qual-table th {
        padding: 8px 12px;
        text-align: start;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted2);
        border-bottom: 1px solid var(--border2);
      }
      table.qual-table td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      table.qual-table tbody tr:last-child td {
        border-bottom: none;
      }
      table.qual-table tbody tr:hover {
        background: var(--surface3);
      }
      .medal {
        font-size: 16px;
      }
      .rank-num {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted2);
      }
      .bracket-rounds {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px;
      }
      .bracket-round {
        flex: 1;
        min-width: 200px;
      }
      .bracket-round-label {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--muted2);
        text-transform: uppercase;
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border2);
      }
      .bracket-match {
        background: var(--surface3);
        border: 1px solid var(--border2);
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 6px;
      }
      .bracket-match.complete {
        border-color: var(--green);
      }
      .bracket-archer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 2px;
      }
      .bracket-archer-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 13px;
        font-weight: 700;
      }
      .bracket-archer.winner .bracket-archer-name {
        color: var(--green);
      }
      .bracket-score {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 14px;
        font-weight: 900;
        color: var(--accent);
      }
      .bracket-archer.winner .bracket-score {
        color: var(--green);
      }
      .bracket-sep {
        height: 1px;
        background: var(--border2);
        margin: 2px 0;
      }
      .bracket-label {
        font-size: 9px;
        color: var(--muted);
        text-align: center;
        margin-top: 4px;
        font-family: 'Barlow Condensed', sans-serif;
      }
      .podium {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px;
      }
      .podium-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: var(--surface3);
        border: 1px solid var(--border);
      }
      .podium-row.p1 {
        background: #fffde733;
        border-color: #ffd70044;
      }
      .podium-row.p2 {
        background: #90909010;
        border-color: #c0c0c022;
      }
      .podium-row.p3 {
        background: #cd7f3210;
        border-color: #cd7f3222;
      }
      .podium-medal {
        font-size: 22px;
        width: 32px;
        text-align: center;
      }
      .podium-rank {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted2);
        width: 24px;
      }
      .podium-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 16px;
        font-weight: 700;
        flex: 1;
      }
      .podium-score {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 18px;
        font-weight: 900;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">ALL IN</div>
      <div class="header-title" id="history-title">Competition History</div>
      <button class="back-btn" id="back-btn" onclick="showList()">← ALL COMPETITIONS</button>
    </div>

    <div class="content">
      <div id="list-view">
        <div id="comp-list" class="comp-list">
          <div class="empty-state">
            <div class="icon">⏳</div>
            <p id="loading-text">Loading competitions...</p>
          </div>
        </div>
      </div>
      <div id="detail-view" class="comp-detail">
        <div class="comp-detail-header" id="detail-header"></div>
        <div id="detail-body"></div>
      </div>
    </div>

    <script src="he-text.js" data-keep-ltr=".bracket-rounds"></script>
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        deleteDoc,
        onSnapshot,
        writeBatch,
        setDoc,
        getCountFromServer,
      } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
      import {
        getAuth,
        onAuthStateChanged,
      } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
      const liveConfig = {
        apiKey: 'AIzaSyBVDdelVGWJOgQZwN_Um6rppelcNYVN2To',
        authDomain: 'all-in-competition.firebaseapp.com',
        projectId: 'all-in-competition',
        storageBucket: 'all-in-competition.firebasestorage.app',
        messagingSenderId: '620146958631',
        appId: '1:620146958631:web:1e88019d1436372689c902',
      };
      const devConfig = {
        apiKey: 'AIzaSyDjmlQJbyRUXXFRlEfVMil0M_DFFUP5Fcc',
        authDomain: 'all-in-dev-f2807.firebaseapp.com',
        projectId: 'all-in-dev-f2807',
        storageBucket: 'all-in-dev-f2807.firebasestorage.app',
        messagingSenderId: '358306227588',
        appId: '1:358306227588:web:4e3ad05ffc3812415d69d1',
      };
      // Live data only on GitHub Pages; anywhere else (your computer) uses all-in-dev
      const firebaseConfig = location.hostname.endsWith('github.io') ? liveConfig : devConfig;
      const app = initializeApp(firebaseConfig);
      /* ── SAFE TEXT ──
         Everything read from Firebase goes through cleanData(): characters that could break the page
         or run code (< > " ' & ` \\) are swapped for look-alikes, e.g. O'Brien → O’Brien. */
      const UNSAFE = { '<': '‹', '>': '›', '"': '”', "'": '’', '&': '＆', '`': 'ʹ', '\\': '∖' };
      const cleanText = (s) => String(s).replace(/[<>"'&`\\]/g, (ch) => UNSAFE[ch]);
      /* Qualification ranking (World Archery): total, then the discipline's tie-break counts.
         Outdoor: 10s counting X (g1 = X, g2 = 10 without X), then X. Indoor: 10, then 9.
         3D: 11, then 10. Field: 6, then 5. Custom: average of kills/11s/6s.
         Archers equal on everything share the place, shown with "=". */
      function tieKeys(s, disc) {
        s = s || {};
        if (disc === 'Outdoor') return [s.total || 0, (s.g1 || 0) + (s.g2 || 0), s.g1 || 0];
        if (disc === 'Custom')
          return [s.total || 0, ((s.kills || 0) + (s.elevens || 0) + (s.sixes || 0)) / 3];
        return [s.total || 0, s.g1 || 0, s.g2 || 0];
      }
      function cmpQual(a, b, disc) {
        const ka = tieKeys(a, disc),
          kb = tieKeys(b, disc);
        for (let i = 0; i < ka.length; i++) if (kb[i] !== ka[i]) return kb[i] - ka[i];
        return 0;
      }
      // places for a ranked list: [{ place: 3, tied: true }, …]
      function qualPlaces(ranked, disc) {
        const out = [];
        ranked.forEach((a, i) => {
          const same = (j) => j >= 0 && j < ranked.length && cmpQual(ranked[j], a, disc) === 0;
          out.push({
            place: same(i - 1) ? out[i - 1].place : i + 1,
            tied: same(i - 1) || same(i + 1),
          });
        });
        return out;
      }
      const placeText = (p) => (p.tied ? '=' : '') + p.place;
      const medalText = (p, plain) =>
        !p.tied && p.place === 1
          ? '🥇'
          : !p.tied && p.place === 2
            ? '🥈'
            : !p.tied && p.place === 3
              ? '🥉'
              : plain;
      function cleanData(v) {
        if (typeof v === 'string') return cleanText(v);
        if (Array.isArray(v)) return v.map(cleanData);
        if (v && typeof v === 'object') {
          if (typeof v.toMillis === 'function') return v; // Firestore timestamp
          const o = {};
          Object.keys(v).forEach((k) => (o[k] = cleanData(v[k])));
          return o;
        }
        return v;
      }
      const db = getFirestore(app);
      /* Each club sees only its own History: ?club=… (from the admin or the scoring app), or the club
         of the admin logged in on this device. Only that club's admins (and the owner) can delete. */
      const OWNER_EMAIL = 'matan1sharon@gmail.com';
      const auth = getAuth(app);
      const clubParam = new URLSearchParams(location.search).get('club');
      let viewer = { owner: false, clubId: null };
      async function whoIsHere(u) {
        viewer = { owner: false, clubId: null };
        if (!u) return;
        viewer.owner = (u.email || '').toLowerCase() === OWNER_EMAIL && u.emailVerified;
        try {
          const snap = await getDoc(doc(db, 'users', u.uid));
          if (snap.exists()) viewer.clubId = snap.data().clubId || null;
        } catch (e) {}
      }
      /* ── DATA LAYOUT ──
         competitions/{id}            settings (name, date, discipline, targets, sessions, targetConfig…)
           archers/{archerId}         public archer info
           contacts/{archerId}        phone, email (admin only)
           scores/{archerId}          qualification score
           brackets/{catKey}          elimination bracket settings + roundCounts
           matches/{catKey~round~i}   one elimination match
         Pages rebuild the old in-memory shape ({archers:[], scores:{}, elimination:{}}) from these. */
      const compRef = (id) => doc(db, 'competitions', id);
      const sub = (id, name) => collection(db, 'competitions', id, name);
      const safeId = (s) => encodeURIComponent(String(s));
      const matchDocId = (catKey, roundKey, idx) => safeId(catKey) + '~' + roundKey + '~' + idx;
      const archerSortKey = (a) =>
        a.registeredAt ? Date.parse(a.registeredAt) : Number(a.id) || 0;
      function buildArchers(archerDocs, contactDocs) {
        const contacts = {};
        (contactDocs || []).forEach((d) => (contacts[d.id] = cleanData(d.data())));
        return archerDocs
          .map((d) => ({ ...cleanData(d.data()), ...(contacts[d.id] || {}), id: d.id }))
          .filter((a) => !a.dns) // DNS archers are not shown on this page
          .sort((a, b) => archerSortKey(a) - archerSortKey(b));
      }
      function buildScores(scoreDocs) {
        const s = {};
        scoreDocs.forEach((d) => (s[d.id] = cleanData(d.data())));
        return s;
      }
      function buildElimination(bracketDocs, matchDocs) {
        const elim = {};
        bracketDocs.forEach((d) => {
          const { catKey, roundCounts, ...meta } = cleanData(d.data());
          const rounds = {};
          Object.entries(roundCounts || {}).forEach(
            ([rk, n]) => (rounds[rk] = new Array(n).fill(undefined)),
          );
          elim[catKey] = { ...meta, rounds };
        });
        matchDocs.forEach((d) => {
          const { catKey, roundKey, idx, match } = cleanData(d.data());
          const r = elim[catKey]?.rounds[roundKey];
          if (r && idx < r.length) r[idx] = match;
        });
        // A bracket whose matches haven't all arrived yet is left out until they do
        Object.keys(elim).forEach((ck) => {
          if (Object.values(elim[ck].rounds).some((r) => r.some((m) => m === undefined)))
            delete elim[ck];
        });
        return elim;
      }
      function assembleComp(compSnap, archerDocs, contactDocs, scoreDocs, bracketDocs, matchDocs) {
        return {
          ...cleanData(compSnap.data()),
          archers: buildArchers(archerDocs, contactDocs),
          scores: buildScores(scoreDocs),
          elimination: buildElimination(bracketDocs, matchDocs),
        };
      }
      // One-time read of a whole competition
      async function loadComp(id, withContacts = false) {
        const [c, a, ct, s, b, m] = await Promise.all([
          getDoc(compRef(id)),
          getDocs(sub(id, 'archers')),
          withContacts ? getDocs(sub(id, 'contacts')) : Promise.resolve({ docs: [] }),
          getDocs(sub(id, 'scores')),
          getDocs(sub(id, 'brackets')),
          getDocs(sub(id, 'matches')),
        ]);
        if (!c.exists()) return null;
        return assembleComp(c, a.docs, ct.docs, s.docs, b.docs, m.docs);
      }
      // Live listener on a whole competition; returns an unsubscribe function
      function watchComp(id, withContacts, onData) {
        const parts = {
          comp: null,
          archers: null,
          contacts: withContacts ? null : [],
          scores: null,
          brackets: null,
          matches: null,
        };
        const emit = () => {
          if (Object.values(parts).some((v) => v === null)) return;
          if (!parts.comp.exists()) return onData(null);
          onData(
            assembleComp(
              parts.comp,
              parts.archers,
              parts.contacts,
              parts.scores,
              parts.brackets,
              parts.matches,
            ),
          );
        };
        const names = ['archers', 'scores', 'brackets', 'matches'];
        if (withContacts) names.push('contacts');
        const unsubs = [
          onSnapshot(compRef(id), (s) => {
            parts.comp = s;
            emit();
          }),
          ...names.map((name) =>
            onSnapshot(sub(id, name), (s) => {
              parts[name] = s.docs;
              emit();
            }),
          ),
        ];
        return () => unsubs.forEach((u) => u());
      }
      // Run write operations in batches (Firestore max 500 per batch)
      async function commitOps(ops) {
        for (let i = 0; i < ops.length; i += 400) {
          const b = writeBatch(db);
          ops.slice(i, i + 400).forEach((op) => op(b));
          await b.commit();
        }
      }
      // Delete a competition and everything under it
      async function deleteCompDeep(id) {
        for (const name of ['archers', 'contacts', 'scores', 'brackets', 'matches', 'timer']) {
          const snap = await getDocs(sub(id, name));
          await commitOps(snap.docs.map((d) => (b) => b.delete(d.ref)));
        }
        await deleteDoc(compRef(id));
      }
      let currentLang = 'en';
      window.t = function (key) {
        return T[currentLang]?.[key] || T['en']?.[key] || key;
      };
      function t(key) {
        return window.t(key);
      }
      const T = {
        en: {
          history_title: 'Competition History',
          back_btn: '← ALL COMPETITIONS',
          loading: 'Loading competitions...',
          open_from_club:
            "Open History from your club's admin, or from the scoring app after scanning a QR.",
          no_archived:
            'No archived competitions yet.<br>Competitions are archived automatically 7 days after their date.',
          archers: 'archers',
          delete: '🗑 DELETE',
          qual_results: '🏹 Qualification Results',
          elim_brackets: '⚔️ Elimination Brackets',
          final_ranking: '🏆 Final Ranking',
          men: 'Men',
          women: 'Women',
          name: 'Name',
          score: 'Score',
          round_of: 'Round of',
          quarter_finals: 'Quarter Finals',
          semi_finals: 'Semi Finals',
          final: 'Final',
          bronze: 'Bronze Medal',
          pending: 'PENDING',
          no_results: 'No results yet.',
          confirm_delete: 'Permanently delete',
          cannot_undo: 'This cannot be undone.',
        },
        he: {
          history_title: 'היסטוריית תחרויות',
          back_btn: '→ כל התחרויות',
          loading: 'טוען תחרויות...',
          open_from_club:
            'פתחו את ההיסטוריה מממשק הניהול של המועדון, או מאפליקציית הניקוד אחרי סריקת QR.',
          no_archived:
            'אין תחרויות בארכיון עדיין.<br>תחרויות מועברות לארכיון אוטומטית 7 ימים לאחר תאריכן.',
          archers: 'קשתים',
          delete: '🗑 מחק',
          qual_results: '🏹 תוצאות מוקדמות',
          elim_brackets: '⚔️ עצי הדחות',
          final_ranking: '🏆 דירוג סופי',
          men: 'גברים',
          women: 'נשים',
          name: 'שם',
          score: 'ניקוד',
          round_of: 'סיבוב',
          quarter_finals: 'רבע גמר',
          semi_finals: 'חצי גמר',
          final: 'גמר',
          bronze: 'מקצה ארד',
          pending: 'ממתין',
          no_results: 'אין תוצאות עדיין.',
          confirm_delete: 'מחק לצמיתות',
          cannot_undo: 'לא ניתן לבטל פעולה זו.',
        },
      };
      function initHistoryLang() {
        const saved =
          localStorage.getItem('adminLang') || localStorage.getItem('scoringLang') || 'en';
        currentLang = saved;
        if (window.HeText) HeText.setLang(currentLang);
        applyHistoryTranslations();
      }
      function applyHistoryTranslations() {
        const lang = currentLang;
        const tr = (key) => T[lang]?.[key] || T['en']?.[key] || key;
        const title = document.querySelector('.header-title');
        if (title) title.textContent = tr('history_title');
        const backBtn = document.getElementById('back-btn');
        if (backBtn) backBtn.textContent = tr('back_btn');
        const loadingText = document.getElementById('loading-text');
        if (loadingText) loadingText.textContent = tr('loading');
        const histTitle = document.getElementById('history-title');
        if (histTitle) histTitle.textContent = tr('history_title');
      }
      const BOW_ORDER = ['Recurve', 'Compound', 'Barebow', 'Traditional', 'Longbow'];
      const AGE_ORDER = ['U12', 'U14', 'U18', 'U21', 'Senior', 'Master 50+', 'Master 60+'];
      const BOW_COLORS = {
        Recurve: '#1565c0',
        Compound: '#4a148c',
        Barebow: '#1b5e20',
        Traditional: '#e65100',
        Longbow: '#37474f',
      };
      function getRoundLabel(rk, bracketSize) {
        if (rk === 'R1') return t('round_of') + ' ' + (bracketSize * 2 || 16);
        if (rk === 'QF') return t('quarter_finals');
        if (rk === 'SF') return t('semi_finals');
        if (rk === 'F') return '🏆 ' + t('final');
        if (rk === 'B') return '🥉 ' + t('bronze');
        return rk;
      }
      function getScore(scores, archerId) {
        const key = String(archerId).replace(/\./g, '_');
        return scores[key] || scores[String(archerId)] || {};
      }
      async function loadArchived() {
        const club = clubParam || viewer.clubId;
        const listEl0 = document.getElementById('comp-list');
        if (!club && !viewer.owner) {
          listEl0.innerHTML = `<div class="empty-state"><div class="icon">🏛</div><p>${t('open_from_club')}</p></div>`;
          return;
        }
        const snap = await getDocs(collection(db, 'competitions'));
        const archived = snap.docs
          .filter((d) => cleanData(d.data()).archived === true)
          .filter((d) => (club ? cleanData(d.data()).clubId === club : true))
          .map((d) => ({ id: d.id, ...cleanData(d.data()) }))
          .sort((a, b) => new Date(b.date) - new Date(a.date));
        // Archer counts come from each competition's archers collection
        await Promise.all(
          archived.map(async (c) => {
            const cnt = await getCountFromServer(sub(c.id, 'archers'));
            c.archerCount = cleanData(cnt.data()).count;
          }),
        );
        const listEl = document.getElementById('comp-list');
        if (!archived.length) {
          listEl.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>${t('no_archived')}</p></div>`;
          return;
        }
        currentLang =
          localStorage.getItem('adminLang') || localStorage.getItem('scoringLang') || 'en';
        if (window.HeText) HeText.setLang(currentLang);
        listEl.innerHTML = archived
          .map((c) => {
            const archers = c.archerCount || 0;
            const date = c.date
              ? new Date(c.date).toLocaleDateString('en-GB', {
                  day: 'numeric',
                  month: 'long',
                  year: 'numeric',
                })
              : '—';
            return `<div class="comp-card" onclick="openComp('${c.id}')"><div class="comp-card-name">${c.name || 'Unnamed'}</div><div class="comp-card-meta"><span>📅 ${date}</span>${c.location ? `<span>📍 ${c.location}</span>` : ''} ${c.organizer ? `<span>🏛 ${c.organizer}</span>` : ''}</div><div class="comp-card-footer"><div class="comp-card-archers">${archers} ${t('archers')}</div><div style="display:flex;align-items:center;gap:8px;"><div class="comp-card-disc">${c.discipline || 'Outdoor'}</div><button onclick="event.stopPropagation();deleteComp('${c.id}','${c.name || ''}')" ${viewer.owner || (viewer.clubId && viewer.clubId === c.clubId) ? '' : 'hidden'} style="background:#e5393522;border:1px solid #e5393544;color:#e53935;padding:4px 10px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;cursor:pointer;">${t('delete')}</button></div></div></div>`;
          })
          .join('');
      }
      window.openComp = async (id) => {
        const data = await loadComp(id);
        if (!data) return;
        const d = { id, ...data };
        renderDetail(d);
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        document.getElementById('back-btn').style.display = 'inline-block';
        window.scrollTo(0, 0);
      };
      window.showList = () => {
        document.getElementById('list-view').style.display = 'block';
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
      };
      function renderDetail(d) {
        const archers = d.archers || [];
        const scores = d.scores || {};
        const elim = d.elimination || {};
        const disc = d.discipline || 'Outdoor';
        const date = d.date
          ? new Date(d.date).toLocaleDateString('en-GB', {
              day: 'numeric',
              month: 'long',
              year: 'numeric',
            })
          : '—';
        document.getElementById('detail-header').innerHTML =
          `<div class="comp-detail-name">${d.name || 'Unnamed Competition'}</div><div class="comp-detail-meta"><div class="meta-item">📅 <strong>${date}</strong></div>${d.location ? `<div class="meta-item">📍 <strong>${d.location}</strong></div>` : ''} ${d.organizer ? `<div class="meta-item">🏛 <strong>${d.organizer}</strong></div>` : ''}<div class="meta-item">🎯 <strong>${disc}</strong></div><div class="meta-item">🏹 <strong>${archers.length} ${t('archers')}</strong></div></div>`;
        const scored = archers
          .filter((a) => (getScore(scores, a.id)?.total || 0) > 0)
          .map((a) => {
            const s = getScore(scores, a.id);
            return {
              ...a,
              total: s.total || 0,
              xs: s.xs || 0,
              tens: s.tens || 0,
              g1: s.g1 || 0,
              g2: s.g2 || 0,
              h1: s.h1 || 0,
              h2: s.h2 || 0,
              kills: s.kills || 0,
              elevens: s.elevens || 0,
              sixes: s.sixes || 0,
            };
          });
        const catMap = {};
        scored.forEach((a) => {
          const key = `${a.bow}||${a.age}||${a.gender}`;
          if (!catMap[key]) catMap[key] = { bow: a.bow, age: a.age, gender: a.gender, archers: [] };
          catMap[key].archers.push(a);
        });
        const cats = Object.values(catMap).sort((a, b) => {
          const bi = BOW_ORDER.indexOf(a.bow) - BOW_ORDER.indexOf(b.bow);
          if (bi !== 0) return bi;
          const ai = AGE_ORDER.indexOf(a.age) - AGE_ORDER.indexOf(b.age);
          if (ai !== 0) return ai;
          return a.gender.localeCompare(b.gender);
        });
        const showHalves = disc === 'Outdoor' || disc === 'Indoor';
        const hasElim = Object.keys(elim).length > 0;
        let html = `<div class="section"><div class="section-title">${t('qual_results')}</div><div class="section-body"><div class="cat-pills" id="qual-pills">${cats
          .map((cat, i) => {
            const gLabel = cat.gender === 'M' ? t('men') : t('women');
            const color = BOW_COLORS[cat.bow] || '#555';
            return `<button class="cat-pill" style="border-color:${color}44;color:${color};" onclick="togglePanel('qual-panel-${i}',this)">${cat.bow} · ${cat.age} · ${gLabel}</button>`;
          })
          .join('')}</div>${cats
          .map((cat, i) => {
            const isCustom = d.discipline === 'Custom';
            const ranked = [...cat.archers].sort((a, b) => cmpQual(a, b, d.discipline));
            const places = qualPlaces(ranked, d.discipline);
            const gLabel = cat.gender === 'M' ? t('men') : t('women');
            const color = BOW_COLORS[cat.bow] || '#555';
            const rows = ranked
              .map((a, ri) => {
                const rankDisplay = medalText(
                  places[ri],
                  `<span class="rank-num">${placeText(places[ri])}</span>`,
                );
                const halves = showHalves
                  ? `<td style="color:var(--muted2);text-align:center;">${a.h1 || 0}</td><td style="color:var(--muted2);text-align:center;">${a.h2 || 0}</td>`
                  : '';
                return `<tr><td style="text-align:center;width:36px;">${rankDisplay}</td><td style="font-weight:600;">${a.name}</td>${halves}<td style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:var(--accent);text-align:center;">${a.total}</td><td style="color:var(--muted2);text-align:center;">${isCustom ? a.kills || 0 : a.xs}</td><td style="color:var(--muted2);text-align:center;">${isCustom ? a.elevens || 0 : a.tens}</td>${isCustom ? `<td style="color:var(--muted2);text-align:center;">${a.sixes || 0}</td>` : ''}</tr>`;
              })
              .join('');
            const hdrHalves = showHalves
              ? '<th style="text-align:center;">H1</th><th style="text-align:center;">H2</th>'
              : '';
            return `<div class="cat-panel" id="qual-panel-${i}"><div style="padding:10px 14px;background:${color}22;border-bottom:1px solid ${color}33;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:${color};">${cat.bow.toUpperCase()} · ${cat.age} · ${gLabel}</span></div><table class="qual-table"><thead><tr><th></th><th>${t('name')}</th>${hdrHalves}<th style="text-align:center;">${t('score')}</th><th style="text-align:center;">${isCustom ? 'Kills' : 'X'}</th><th style="text-align:center;">${isCustom ? '11s' : '10'}</th>${isCustom ? '<th style="text-align:center;">6s</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`;
          })
          .join('')}</div></div>`;
        if (hasElim) {
          const elimCats = Object.entries(elim).sort((a, b) => a[0].localeCompare(b[0]));
          html += `<div class="section"><div class="section-title">${t('elim_brackets')}</div><div class="section-body"><div class="cat-pills">${elimCats
            .map(([key, data], i) => {
              const gLabel = data.gender === 'M' ? t('men') : t('women');
              const color = BOW_COLORS[data.bow] || '#555';
              return `<button class="cat-pill" style="border-color:${color}44;color:${color};" onclick="togglePanel('elim-panel-${i}',this)">${data.bow} · ${data.age} · ${gLabel}</button>`;
            })
            .join('')}</div>${elimCats
            .map(([key, data], i) => {
              const gLabel = data.gender === 'M' ? t('men') : t('women');
              const color = BOW_COLORS[data.bow] || '#555';
              const isCum = data.format === 'cumulative';
              const roundOrder = ['R1', 'QF', 'SF', 'F', 'B'];
              const rounds = roundOrder.filter((rk) => data.rounds?.[rk]?.length > 0);
              const roundsHtml = rounds
                .map((rk) => {
                  const matches = data.rounds[rk];
                  const matchesHtml = matches
                    .map((m) => {
                      if (m.isBye)
                        return `<div class="bracket-match"><div class="bracket-archer"><span class="bracket-archer-name" style="color:var(--accent);">${m.archer1?.name || '?'}</span><span style="font-size:10px;color:var(--accent);">BYE ✓</span></div></div>`;
                      const w1 = m.winnerChoice && String(m.winnerChoice) === String(m.archer1?.id);
                      const w2 = m.winnerChoice && String(m.winnerChoice) === String(m.archer2?.id);
                      let s1, s2;
                      if (isCum) {
                        s1 = m.score1 ?? '';
                        s2 = m.score2 ?? '';
                      } else {
                        let p1 = 0,
                          p2 = 0;
                        (m.sets || []).forEach((s) => {
                          if (s.score1 > s.score2) p1 += 2;
                          else if (s.score2 > s.score1) p2 += 2;
                          else {
                            p1 += 1;
                            p2 += 1;
                          }
                        });
                        s1 = m.winnerChoice ? p1 : '';
                        s2 = m.winnerChoice ? p2 : '';
                      }
                      return `<div class="bracket-match ${m.winnerChoice ? 'complete' : ''}"><div class="bracket-archer ${w1 ? 'winner' : ''}"><span class="bracket-archer-name">${m.archer1?.name || '?'}</span><span class="bracket-score">${s1}</span></div><div class="bracket-sep"></div><div class="bracket-archer ${w2 ? 'winner' : ''}"><span class="bracket-archer-name">${m.archer2?.name || '?'}</span><span class="bracket-score">${s2}</span></div>${m.winnerChoice ? '' : '<div class="bracket-label">PENDING</div>'}</div>`;
                    })
                    .join('');
                  return `<div class="bracket-round"><div class="bracket-round-label">${getRoundLabel(rk, data.bracketSize)}</div>${matchesHtml}</div>`;
                })
                .join('');
              return `<div class="cat-panel" id="elim-panel-${i}"><div style="padding:10px 14px;background:${color}22;border-bottom:1px solid ${color}33;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:${color};">${data.bow.toUpperCase()} · ${data.age} · ${gLabel}</span></div><div class="bracket-rounds">${roundsHtml}</div></div>`;
            })
            .join('')}</div></div>`;
          html += `<div class="section"><div class="section-title">${t('final_ranking')}</div><div class="section-body"><div class="cat-pills">${elimCats
            .map(([key, data], i) => {
              const gLabel = data.gender === 'M' ? t('men') : t('women');
              const color = BOW_COLORS[data.bow] || '#555';
              return `<button class="cat-pill" style="border-color:${color}44;color:${color};" onclick="togglePanel('rank-panel-${i}',this)">${data.bow} · ${data.age} · ${gLabel}</button>`;
            })
            .join('')}</div>${elimCats
            .map(([key, data], i) => {
              const gLabel = data.gender === 'M' ? t('men') : t('women');
              const color = BOW_COLORS[data.bow] || '#555';
              const ranking = [];
              const finalMatch = data.rounds?.F?.[0];
              if (finalMatch?.winnerChoice) {
                const winner =
                  finalMatch.winnerChoice === finalMatch.archer1?.id
                    ? finalMatch.archer1
                    : finalMatch.archer2;
                const runnerUp =
                  finalMatch.winnerChoice === finalMatch.archer1?.id
                    ? finalMatch.archer2
                    : finalMatch.archer1;
                if (winner) ranking.push({ pos: 1, archer: winner });
                if (runnerUp) ranking.push({ pos: 2, archer: runnerUp });
              }
              const bronzeMatch = data.rounds?.B?.[0];
              if (bronzeMatch?.winnerChoice) {
                const bronze =
                  bronzeMatch.winnerChoice === bronzeMatch.archer1?.id
                    ? bronzeMatch.archer1
                    : bronzeMatch.archer2;
                const fourth =
                  bronzeMatch.winnerChoice === bronzeMatch.archer1?.id
                    ? bronzeMatch.archer2
                    : bronzeMatch.archer1;
                if (bronze) ranking.push({ pos: 3, archer: bronze });
                if (fourth) ranking.push({ pos: 4, archer: fourth });
              }
              const sfMatches = data.rounds?.SF || [];
              sfMatches.forEach((m, mi) => {
                if (m.winnerChoice) {
                  const loser = m.winnerChoice === m.archer1?.id ? m.archer2 : m.archer1;
                  if (loser && !ranking.find((r) => r.archer?.id === loser?.id))
                    ranking.push({ pos: 5 + mi, archer: loser });
                }
              });
              const qfMatches = data.rounds?.QF || [];
              let qfPos = ranking.length + 1;
              qfMatches.forEach((m) => {
                if (m.winnerChoice) {
                  const loser = m.winnerChoice === m.archer1?.id ? m.archer2 : m.archer1;
                  if (loser && !ranking.find((r) => r.archer?.id === loser?.id))
                    ranking.push({ pos: qfPos++, archer: loser });
                }
              });
              const r1Matches = data.rounds?.R1 || [];
              let r1Pos = ranking.length + 1;
              r1Matches.forEach((m) => {
                if (m.winnerChoice && !m.isBye) {
                  const loser = m.winnerChoice === m.archer1?.id ? m.archer2 : m.archer1;
                  if (loser && !ranking.find((r) => r.archer?.id === loser?.id))
                    ranking.push({ pos: r1Pos++, archer: loser });
                }
              });
              const medals = ['🥇', '🥈', '🥉'];
              const podiumHtml = ranking
                .map(({ pos, archer }) => {
                  const medal = medals[pos - 1] || '';
                  const cls = pos === 1 ? 'p1' : pos === 2 ? 'p2' : pos === 3 ? 'p3' : '';
                  const qualCat = cats.find(
                    (c) => c.bow === data.bow && c.age === data.age && c.gender === data.gender,
                  );
                  const qualArcher = qualCat?.archers.find(
                    (a) => String(a.id) === String(archer?.id),
                  );
                  return `<div class="podium-row ${cls}"><div class="podium-medal">${medal}</div><div class="podium-rank" style="${medal ? 'display:none' : ''}">${pos}</div><div class="podium-name">${archer?.name || '?'}</div>${qualArcher ? `<div class="podium-score">${qualArcher.total}</div>` : ''}</div>`;
                })
                .join('');
              return `<div class="cat-panel" id="rank-panel-${i}"><div style="padding:10px 14px;background:${color}22;border-bottom:1px solid ${color}33;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:${color};">${data.bow.toUpperCase()} · ${data.age} · ${gLabel}</span></div><div class="podium">${podiumHtml || `<p style="color:var(--muted2);font-size:13px;padding:8px;">${t('no_results')}</p>`}</div></div>`;
            })
            .join('')}</div></div>`;
        }
        document.getElementById('detail-body').innerHTML = html;
      }
      window.togglePanel = (id, btn) => {
        const panel = document.getElementById(id);
        if (!panel) return;
        const isOpen = panel.classList.contains('open');
        const section = btn.closest('.section-body');
        if (section) {
          section.querySelectorAll('.cat-panel').forEach((p) => p.classList.remove('open'));
          section.querySelectorAll('.cat-pill').forEach((b) => b.classList.remove('open'));
        }
        if (!isOpen) {
          panel.classList.add('open');
          btn.classList.add('open');
        }
      };
      window.deleteComp = async (id, name) => {
        if (!confirm(`${t('confirm_delete')} "${name}"?\n\n${t('cannot_undo')}`)) return;
        await deleteCompDeep(id);
        await loadArchived();
      };
      initHistoryLang();
      onAuthStateChanged(auth, async (u) => {
        await whoIsHere(u);
        loadArchived();
      });
    </script>
  </body>
</html>
